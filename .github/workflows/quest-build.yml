name: Quest Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/meta-quest-xr-upgrade
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity-first Quest files exist
        run: |
          test -f Assets/CriticalVR/Scripts/Runtime/MotionToExperienceManager.cs
          test -f Assets/CriticalVR/Scripts/Rendering/CriticalVRFullscreenRendererFeature.cs
          test -f Assets/CriticalVR/Scripts/Editor/CriticalVRProjectBootstrap.cs
          test -f Assets/CriticalVR/Scripts/Editor/CriticalVRProjectValidator.cs
          test -f Assets/CriticalVR/Scripts/Editor/CriticalVRBuildAutomation.cs
          test -f Assets/CriticalVR/Shaders/CriticalVRPassthroughTrip.shader
          test -f Assets/CriticalVR/Scenes/CriticalVR_QuestBootstrap.unity
          test -f Docs/Quest/SetupGuide.md
          test -f Docs/Quest/BUILD_AND_INSTALL.md
          test -f Tools/build_quest.bat
          test -f Tools/build_and_install_quest.bat

  unity-build:
    needs: validate-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Unity license is configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Missing UNITY_LICENSE secret. Unity batch builds cannot run without a license."
            exit 1
          fi

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Quest-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Quest-

      - name: Build Quest development APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: CriticalVR.EditorTools.CriticalVRBuildAutomation.BuildQuestDevelopmentCI

      - name: Upload Quest build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-vr-quest-build
          path: |
            Builds/Quest/**
            Docs/Quest/ValidationReport.latest.md
